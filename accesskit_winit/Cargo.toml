[package]
name = "accesskit_winit"
version = "0.28.0"
license = "Apache-2.0"
description = "AccessKit UI accessibility infrastructure: winit adapter"
keywords = ["gui", "ui", "accessibility", "winit"]
readme = "README.md"
edition = '2021'

[features]
default = ["accesskit_unix", "async-io", "rwh_05", "winit/x11", "winit/wayland"]
async-io = ["accesskit_unix/async-io"]
tokio = ["accesskit_unix/tokio"]

[dependencies]
accesskit = { version = "0.20.0" }
rwh_05 = { package = "raw-window-handle", version = "0.5", features = [
    "std",
], optional = true }
rwh_06 = { package = "raw-window-handle", version = "0.6.2", features = [
    "std",
], optional = true }


[dependencies.winit]
git = "https://github.com/iced-rs/winit.git"
rev = "940457522e9fb9f5dac228b0ecfafe0138b4048c"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "0.28.0"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = "0.21.0"

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
accesskit_unix = { version = "0.16.0", optional = true, default-features = false }

